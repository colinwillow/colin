# Turning a recording into something he can read out, without a terminal.
#
# DROP TWO FILES IN `essays/` AND PUSH. That is the whole interface, and it can
# be done from a phone:
#
#   essays/my-essay.mp3   what you read out
#   essays/my-essay.txt   the words you read
#
# The names have to match. This notices, works out when every word was spoken,
# writes the audio and the timings into `public/narration/`, and commits them —
# which makes Pages rebuild, which puts it on the site. Nothing to install and
# nothing to run.
#
# WHY IT IS HERE AND NOT SOMEWHERE ELSE: this needs Whisper, which is a few
# gigabytes of model, and ffmpeg. A runner has both and a phone has neither.
# It is also the only part of this project that cannot be done from the app.
name: Bake a reading

on:
  push:
    branches: [main]
    paths:
      - 'essays/**.mp3'
      - 'essays/**.m4a'
      - 'essays/**.wav'
      - 'essays/**.txt'
  workflow_dispatch:
    inputs:
      only:
        description: 'One essay by name (without the extension). Blank does all of them.'
        required: false
      force:
        description: 'Redo ones that already exist'
        type: boolean
        default: false

# It commits what it makes.
permissions:
  contents: write

concurrency:
  group: narrate
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The model is the slow part and it does not change, so it is kept between
      # runs. First run downloads it; every one after that starts in seconds.
      - name: Cache the Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          # faster-whisper rather than openai-whisper: same model, a fraction of
          # the install, and it runs on a plain CPU runner at something like ten
          # times real time.
          python -m pip install --quiet faster-whisper
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Work out when every word was said
        id: align
        env:
          ONLY: ${{ github.event.inputs.only }}
          FORCE: ${{ github.event.inputs.force }}
        run: python .github/scripts/align_essays.py

      - name: Build the readings
        run: |
          shopt -s nullglob
          for job in .narration-jobs/*.json; do
            node .github/scripts/run-align.mjs "$job"
          done

      - name: Commit them
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/narration
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "Bake the readings

          Made by .github/workflows/narrate.yml from what is in essays/.
          Word timings from Whisper, so his mouth follows the recording."
          # Somebody may have pushed while the model was running.
          git pull --rebase --autostash origin main
          git push origin HEAD:main
