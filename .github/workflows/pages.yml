name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed for the Pages deployment to authenticate itself.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. Superseded runs are cancelled rather than queued:
# during rapid iteration they otherwise pile up behind each other and the Pages
# deploy step times out after ten minutes, leaving the site on a stale build.
# Only the newest commit matters here anyway.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        # The site is served from https://<user>.github.io/<repo>/, so everything
        # has to be prefixed with the repo name.
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
