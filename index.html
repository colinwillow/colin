<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable stop the double-tap and pinch zoom, which on a
         fixed 3D view only ever leaves the canvas stranded off-screen. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <!-- NO ZOOMING. A twin-stick game is two thumbs on glass, and every one of the
         browser's own gestures is something a thumb does by accident: a double tap
         while jabbing at a control, two fingers landing at once on the sticks.
         THREE DIFFERENT MECHANISMS HAVE TO BE TURNED OFF AND ONLY ONE OF THEM IS
         THE VIEWPORT META:

           double-tap zoom  `touch-action` in the CSS. iOS Safari has IGNORED
                            `user-scalable=no` since iOS 10 -- it is honoured on
                            Android and nowhere else that matters, so the meta tag
                            is not the fix and never was.
           PINCH zoom       its own non-standard event family. `gesturestart` /
                            `gesturechange` / `gestureend` fire for two fingers and
                            zoom the page whatever the CSS says; `touch-action`
                            does not cover them.
           desktop          `dblclick`, belt and braces for a trackpad.

         FIRST IN THE HEAD, with the crash trap, and deliberately not in a module:
         a guard that only installs once the game has loaded is a guard that is
         absent for the whole of the loading screen -- and missing entirely if the
         module throws, which is exactly when somebody starts jabbing at it. -->
    <script>
    for (var i = 0, G = ['gesturestart', 'gesturechange', 'gestureend', 'dblclick']; i < G.length; i++)
      addEventListener(G[i], function (e) { e.preventDefault(); }, { passive: false });
    </script>
    <title>Colin</title>

    <!-- ADD TO HOME SCREEN.

         The icon is deliberately full-bleed and square: iOS puts its own
         superellipse mask over whatever it is given, so corners rounded in the
         file get rounded twice and the difference shows as dark wedges. The
         source art had a 28.6% radius baked in — rounder than the mask — so it
         is cropped inside that arc rather than used as-is.

         `apple-mobile-web-app-capable` is what makes the tap open it without
         Safari's chrome; `mobile-web-app-capable` is the standard spelling, and
         iOS still only reads the prefixed one. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Colin" />
    <!-- Translucent, so the room runs under the clock rather than sitting below
         a black band. The panel below gets a safe-area inset to clear it. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0a09" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0a09'/%3E%3Cpath d='M7 15h18v6a4 4 0 0 1-4 4H11a4 4 0 0 1-4-4z' fill='%235fc4bd'/%3E%3Crect x='5' y='12' width='22' height='3' rx='1.5' fill='%23c8a06a'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; }
      /* Pin the page. `overflow: hidden` alone does not stop iOS Safari: a drag
         still rubber-bands the whole document and leaves the canvas off-centre,
         and the URL bar collapsing resizes the viewport under it. Fixed
         positioning plus overscroll-behavior holds it still. */
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0a09;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed;
        inset: 0;
        width: 100%;
        /* No text selection or callout from a long press on the canvas. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        /* ON THE ROOT, not only on the canvas. `touch-action` is not inherited,
           but the browser intersects the values from the hit element up through
           its ancestors -- so `none` here covers every descendant that does not
           override it, and a double tap that happens to land on the HUD, a
           button or the letterbox beside the canvas is covered too. On the
           canvas alone it was not. */
        touch-action: none;
      }
      /* And on the canvas in its own right, so a drag is never a scroll. */
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }

      #loading {
        position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
        font: 500 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        letter-spacing: 0.08em; text-transform: uppercase; color: #8a8178;
        background: #0b0a09; transition: opacity 0.7s ease; z-index: 10;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #bar { width: 190px; height: 2px; background: #241f1b; overflow: hidden; }
      #bar > i { display: block; height: 100%; width: 0%; background: #c8a06a; transition: width 0.25s ease; }
      #error {
        max-width: 44ch; color: #e0836f; text-transform: none; letter-spacing: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
      }
      /* Everything the app draws around the render — the tab bar, the screens,
         the captions, the microphone — is in src/ui/ui.css, which Vite puts
         after this block. Only the things that have to exist BEFORE the first
         module runs are here: the loading overlay, and pinning the page. */
    </style>
  </head>
  <body>
    <div id="loading">
      <div id="label">Loading kitchen</div>
      <div id="bar"><i></i></div>
      <div id="error"></div>
    </div>
    <div id="talk">
      <div id="say"></div>
      <button id="captions" type="button" title="show captions" aria-label="show captions">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="14" rx="3" />
          <path d="M8 11h2M8 15h5M14 11h2" />
        </svg>
      </button>
      <canvas id="wave" width="460" height="44"></canvas>
      <button id="mic" type="button" disabled>talk</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
