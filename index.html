<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable stop the double-tap and pinch zoom, which on a
         fixed 3D view only ever leaves the canvas stranded off-screen. -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Kitchen</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0a09'/%3E%3Cpath d='M7 15h18v6a4 4 0 0 1-4 4H11a4 4 0 0 1-4-4z' fill='%235fc4bd'/%3E%3Crect x='5' y='12' width='22' height='3' rx='1.5' fill='%23c8a06a'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; }
      /* Pin the page. `overflow: hidden` alone does not stop iOS Safari: a drag
         still rubber-bands the whole document and leaves the canvas off-centre,
         and the URL bar collapsing resizes the viewport under it. Fixed
         positioning plus overscroll-behavior holds it still. */
      html, body {
        margin: 0;
        height: 100%;
        background: #0b0a09;
        overflow: hidden;
        overscroll-behavior: none;
        position: fixed;
        inset: 0;
        width: 100%;
        /* No text selection or callout from a long press on the canvas. */
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
      }
      /* touch-action: none means the browser hands us the gesture instead of
         scrolling or pinch-zooming with it. */
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }

      #loading {
        position: fixed; inset: 0; display: grid; place-content: center; gap: 14px;
        font: 500 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        letter-spacing: 0.08em; text-transform: uppercase; color: #8a8178;
        background: #0b0a09; transition: opacity 0.7s ease; z-index: 10;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #bar { width: 190px; height: 2px; background: #241f1b; overflow: hidden; }
      #bar > i { display: block; height: 100%; width: 0%; background: #c8a06a; transition: width 0.25s ease; }
      #error {
        max-width: 44ch; color: #e0836f; text-transform: none; letter-spacing: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap;
      }
      /* --- talking to him --- */
      #talk {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
        display: grid; justify-items: center; gap: 10px;
        /* Clear of the home indicator and of the iOS toolbar. */
        padding: 0 18px calc(18px + env(safe-area-inset-bottom));
        font: 500 13px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif;
        opacity: 0; transition: opacity 0.5s ease 0.4s; pointer-events: none;
      }
      body.ready #talk { opacity: 1; }
      #say {
        max-width: 34ch; text-align: center; color: #efe6db;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.85), 0 0 3px rgba(0, 0, 0, 0.9);
        min-height: 1.45em;
      }
      #say b { font-weight: 500; color: #c8a06a; }
      #mic {
        pointer-events: auto; -webkit-appearance: none; appearance: none;
        border: 1px solid #3a322b; border-radius: 999px; padding: 11px 22px;
        background: rgba(16, 14, 12, 0.72); backdrop-filter: blur(6px);
        color: #cbbfb1; font: inherit; letter-spacing: 0.1em; text-transform: uppercase;
        cursor: pointer; transition: color 0.2s ease, border-color 0.2s ease;
      }
      #mic:disabled { opacity: 0.4; cursor: default; }
      #mic.on { color: #0b0a09; background: #c8a06a; border-color: #c8a06a; }
      /* Thinking or talking: still armed, but not listening to you this second.
         Declared after .on so it wins on a button that is both. */
      #mic.busy { color: #c8a06a; background: rgba(16, 14, 12, 0.72); border-color: #6b5533; }
      /* lil-gui sits top-right; keep it out of the way until the room is up */
      .lil-gui.root { --width: 260px; opacity: 0; transition: opacity 0.5s ease 0.4s; }
      body.ready .lil-gui.root { opacity: 1; }
    </style>
  </head>
  <body>
    <div id="loading">
      <div id="label">Loading kitchen</div>
      <div id="bar"><i></i></div>
      <div id="error"></div>
    </div>
    <div id="talk">
      <div id="say"></div>
      <button id="mic" type="button" disabled>talk</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
